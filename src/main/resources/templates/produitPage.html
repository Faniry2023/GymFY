<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nos Produits - GYMfy</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:sans-serif; background:#f5f5f5; }

        /* Header identique à l'accueil */
        .gymfy-header {
            background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);
            padding:0 2rem;
            display:flex;
            align-items:center;
            justify-content:space-between;
            height:64px;
            color:white;
        }
        .gymfy-logo { font-size:26px; font-weight:700; color:yellow; letter-spacing:2px; }
        .gymfy-logo span { color:#fff; }
        .nav-links { display:flex; gap:24px; list-style:none; }
        .nav-links a { color:#ccc; text-decoration:none; font-size:15px; }
        .nav-links a:hover { color:yellow; }
        .nav-cta { background:rgba(255,0,0,0.7); color:white !important; padding:8px 16px; border-radius:8px; }

        .container { max-width:1300px; margin:0 auto; padding:2rem 20px; }

        .page-title {
            text-align:center;
            font-size:2.4rem;
            margin-bottom:25px;
            color:#1a1a2e;
        }

        .search-bar {
            max-width:600px;
            margin:0 auto 30px;
        }
        .search-bar input {
            width:100%;
            padding:14px 20px;
            border:1px solid #ddd;
            border-radius:50px;
            font-size:1.1rem;
        }

        .products-grid {
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap:25px;
        }

        .card {
            background:#fff;
            border-radius:12px;
            border:1px solid #16213e;
            padding:15px;
            box-shadow:0 6px 15px rgba(0,0,0,0.1);
            transition:transform 0.3s;
        }
        .card:hover { transform:scale(1.05); }

        .card img {
            width:100%;
            height:180px;
            object-fit:cover;
            border-radius:8px;
        }

        .category { font-size:12px; color:#3b82f6; font-weight:bold; text-transform:uppercase; margin:8px 0 4px; }
        .nom { font-size:1.2rem; font-weight:700; margin:5px 0; color:#1a1a2e; }

        .price-stock {
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin:10px 0;
        }
        .price { font-size:1.35rem; font-weight:bold; color:#16213e; }

        .stock-count {
            padding:4px 10px;
            border-radius:6px;
            font-weight:700;
            font-size:0.95rem;
        }
        .stock-vert  { background:#2ecc71; color:white; }
        .stock-jaune { background:#f1c40f; color:black; }
        .stock-rouge { background:red; color:white; }

        .btn-panier {
            width:100%;
            background:#1a1a2e;
            color:white;
            border:none;
            padding:12px;
            border-radius:8px;
            font-weight:600;
            cursor:pointer;
        }
        .btn-panier:disabled {
            background:#ccc;
            cursor:not-allowed;
        }
    </style>
</head>
<body>

<!-- HEADER -->
<header class="gymfy-header">
    <div class="gymfy-logo">GYM<span>fy</span></div>
    <ul class="nav-links">
        <li><a href="/api/produit/acceuil">Accueil</a></li>
        <li><a href="/produits" style="color:yellow; font-weight:700;">🛍️ Produits</a></li>
        <li><a th:href="@{/api/coaching}">💪 Coaching</a></li>
        <li><a th:href="@{/api/panier/monPanier}">🛒 Mon Panier</a></li>
        <li th:if="${isLogged}"><a th:href="@{/api/inscri/deconnexion}" class="nav-cta">Déconnexion</a></li>
        <li th:if="${!isLogged}"><a th:href="@{/api/inscri/deconnexion}" class="nav-cta">Se connecter</a></li>
    </ul>
</header>

<div class="container">
    <h1 class="page-title">Nos Produits</h1>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔎 Rechercher un produit..." onkeyup="filterProducts()">
    </div>

    <div class="products-grid" id="productsGrid">
        <div th:each="p : ${produits}" class="card" th:data-id="${p.id}">
            <img th:src="@{/api/produit/imageProduit/{id}(id=${p.id})}"
                 th:alt="${p.nom}"
                 onerror="this.src='https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=600&q=70'">

            <div class="category" th:text="${p.categorie}"></div>
            <div class="nom" th:text="${p.nom}"></div>

            <div class="price-stock">
                <span class="price" th:text="${p.prix} + ' Ariary'"></span>
                <span class="stock-count"
                      th:classappend="${p.stock <= 5} ? 'stock-rouge' : (${p.stock <= 20} ? 'stock-jaune' : 'stock-vert')"
                      th:text="${p.stock}"></span>
            </div>

            <button class="btn-panier"
                    th:onclick="'ajouterAuPanier(this, ' + ${p.id} + ')'"
                    th:disabled="${p.stock <= 0}"
                    th:text="${p.stock > 0} ? 'Ajouter au panier' : 'Rupture de stock'">
            </button>
        </div>
    </div>
</div>

<script>
    // Recherche
    function filterProducts() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll('.card').forEach(card => {
            const name = card.querySelector('.nom').textContent.toLowerCase();
            card.style.display = name.includes(term) ? '' : 'none';
        });
    }

    // Ajout au panier + Mise à jour du stock en temps réel
    function ajouterAuPanier(btn, id) {
        fetch(`/api/panier/ajoutPanier/${id}`, { method: 'POST' })
        .then(r => r.json())
        .then(data => {
            if (data.succes) {
                // Mise à jour du stock sur la carte
                const stockSpan = btn.parentElement.querySelector('.stock-count');
                stockSpan.textContent = data.nouveauStock;

                // Mise à jour de la couleur
                stockSpan.className = 'stock-count';
                if (data.nouveauStock <= 5) stockSpan.classList.add('stock-rouge');
                else if (data.nouveauStock <= 20) stockSpan.classList.add('stock-jaune');
                else stockSpan.classList.add('stock-vert');

                // Désactiver le bouton si stock épuisé
                if (data.nouveauStock <= 0) {
                    btn.disabled = true;
                    btn.textContent = "Rupture de stock";
                }

                // Message de confirmation
                const originalText = btn.textContent;
                btn.style.background = '#27ae60';
                btn.textContent = "✅ Ajouté !";
                setTimeout(() => {
                    btn.style.background = '#1a1a2e';
                    btn.textContent = originalText;
                }, 1500);
            } else {
                alert(data.message || "Erreur lors de l'ajout");
            }
        })
        .catch(() => alert("Erreur de connexion au serveur"));
    }
</script>

</body>
</html>
